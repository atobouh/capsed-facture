name: Build the office desktop app (Windows)

# Builds « CAPSED Bureau » for Windows.
# Installed apps only update from the release « bureau-latest » (and the download link points there). A build is published
# there only on purpose: a push to main (the pull request merged), the « Run workflow » button, or a commit whose message
# contains [publier]. Every other build goes to « bureau-test », which no installed app watches.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Nouveautés, en une phrase (affichées dans l’application)"
        required: false
        default: ""
  push:
    branches: [main, claude/eloquent-feynman-lgb5tr]
    paths:
      - "src-tauri/**"
      - "app/**"
      - "static-src/**"
      - "public/**"
      - "scripts/build-static.mjs"
      - "scripts/build-guide.mjs"
      - "guide/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

concurrency:
  group: desktop-build
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      CAPSED_API: https://capsed.erdj5926.workers.dev
      # Every build gets its own version: installed apps compare it with latest.json and update themselves.
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm run install:ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Channel
        id: channel
        shell: bash
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_NOTES: ${{ github.event.inputs.notes }}
        run: |
          FIRST=$(printf '%s' "$MESSAGE" | head -n 1)
          if [ "$GITHUB_REF" = "refs/heads/main" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || printf '%s' "$MESSAGE" | grep -q '\[publier\]'; then
            echo "tag=bureau-latest" >> "$GITHUB_OUTPUT"
            NOTES="$INPUT_NOTES"
            if [ -z "$NOTES" ] && printf '%s' "$FIRST" | grep -q '\[publier\]'; then NOTES=$(printf '%s' "$FIRST" | sed 's/\[publier\]//; s/^ *//; s/ *$//'); fi
            echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
            echo "### Publiée pour l’équipe (bureau-latest)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "tag=bureau-test" >> "$GITHUB_OUTPUT"
            echo "notes=" >> "$GITHUB_OUTPUT"
            echo "### Version de test (bureau-test) : les ordinateurs installés ne la reçoivent pas" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Version
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json',c=JSON.parse(require('fs').readFileSync(f));c.version=process.env.APP_VERSION;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          node -e "const f='src-tauri/Cargo.toml',fs=require('fs');fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace(/^version = \"[^\"]*\"/m,'version = \"'+process.env.APP_VERSION+'\"'))"
          node -e "console.log(require('./src-tauri/tauri.conf.json').version)"

      - name: Build the installer
        run: npx tauri build

      - name: Name the installer
        shell: pwsh
        env:
          CHANNEL: ${{ steps.channel.outputs.tag }}
          NOTES: ${{ steps.channel.outputs.notes }}
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName "CAPSED-Bureau-installation.exe"
          $hash = (Get-FileHash "CAPSED-Bureau-installation.exe" -Algorithm SHA256).Hash.ToLower()
          @{ version = $env:APP_VERSION; url = "https://github.com/atobouh/capsed-facture/releases/download/$env:CHANNEL/CAPSED-Bureau-installation.exe"; sha256 = $hash; notes = $env:NOTES; date = (Get-Date -Format o) } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM latest.json
          Get-Content latest.json
          "Installer: $((Get-Item CAPSED-Bureau-installation.exe).Length / 1MB) MB" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: CAPSED-Bureau-Windows
          path: CAPSED-Bureau-installation.exe

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.channel.outputs.tag }}
          name: ${{ steps.channel.outputs.tag == 'bureau-latest' && 'CAPSED Bureau pour Windows' || 'CAPSED Bureau, version de test (non distribuée)' }}
          prerelease: ${{ steps.channel.outputs.tag != 'bureau-latest' }}
          body: |
            Application de bureau CAPSED (facturation et encaissement), fonctionne sans internet.
            1. Téléchargez CAPSED-Bureau-installation.exe et ouvrez-le. Si Windows affiche « Windows a protégé votre ordinateur », cliquez « Informations complémentaires » puis « Exécuter quand même ».
            2. Au premier lancement, tapez le code à 6 chiffres donné par la Direction (Réglages, Équipe et accès, « Relier un ordinateur »).
            Version ${{ env.APP_VERSION }}, construite depuis ${{ github.sha }}. Les ordinateurs déjà installés se mettent à jour tout seuls.
          files: |
            CAPSED-Bureau-installation.exe
            latest.json
          make_latest: ${{ steps.channel.outputs.tag == 'bureau-latest' }}
