[package]
name = "capsed-bureau"
version = "1.0.0"
description = "CAPSED Bureau : facturation et encaissement, même sans internet"
authors = ["CAPSED SUARL"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
